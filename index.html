<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>对比选车终态原型 · S1–S5 双页五态联动 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    --blue:#0a84ff; --blue-deep:#0066d6; --ink:#1c1c1e; --sub:#6b7280;
    --line:#e7eaf0; --bg-card:#ffffff; --hi:#eef5ff; --hi-line:#bcdcff;
    --amber:#b8860b; --gray:#9aa0a8; --green:#1f9d55; --soft:#f4f7fb;
    --shadow:0 8px 28px rgba(18,38,63,.10);
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:#eef1f5;
    background:linear-gradient(180deg,#eef2f7 0%,#e7ecf3 100%);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  /* ===== 演示外框 ===== */
  .demo-banner{
    background:linear-gradient(90deg,#0a84ff,#5e5ce6);
    color:#fff; text-align:center; padding:10px 16px; font-size:13px; letter-spacing:.2px;
    box-shadow:0 2px 12px rgba(10,132,255,.25);
  }
  .demo-banner b{ font-weight:700; }
  .switcher-wrap{
    position:sticky; top:0; z-index:50;
    background:rgba(238,241,245,.82); backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid #dde3ec; padding:12px 16px 14px;
  }
  .switcher{ display:flex; gap:8px; max-width:860px; margin:0 auto; justify-content:center; flex-wrap:wrap; }
  .tab{
    flex:1 1 150px; max-width:170px; cursor:pointer; user-select:none;
    background:#fff; border:1px solid #d8dee8; border-radius:12px; padding:9px 10px 8px;
    text-align:center; transition:all .18s ease; box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .tab .t1{ font-size:14px; font-weight:700; color:#3a3f47; }
  .tab .t2{ font-size:11px; color:#8a909a; margin-top:2px; }
  .tab:hover{ border-color:#9fc4ff; }
  .tab.active{ background:linear-gradient(180deg,#0a84ff,#0a78ed); border-color:#0a78ed; box-shadow:0 6px 16px rgba(10,132,255,.32); }
  .tab.active .t1, .tab.active .t2{ color:#fff; }
  .tab.active .t2{ color:#dbeaff; }

  /* ===== 桌面画布 ===== */
  .canvas{ max-width:980px; margin:0 auto; padding:28px 16px 60px; }
  .stage-line{ text-align:center; color:#7a818c; font-size:12.5px; margin-bottom:18px; }
  .phones{ display:flex; gap:34px; justify-content:center; align-items:flex-start; position:relative; flex-wrap:wrap; }
  .link-arrow{
    align-self:center; display:flex; flex-direction:column; align-items:center; color:#9aa6b6;
    font-size:11px; min-width:54px; padding-top:240px;
  }
  .link-arrow .ln{ width:1px; height:0; }
  .link-arrow svg{ width:54px; height:26px; }
  .link-arrow .cap{ margin-top:4px; width:60px; text-align:center; line-height:1.3; }

  /* ===== iPhone frame ===== */
  .phone{
    width:392px; max-width:94vw; background:#0b0d10; border-radius:46px; padding:11px;
    box-shadow:0 22px 60px rgba(14,28,54,.28), 0 2px 6px rgba(0,0,0,.2);
    position:relative;
  }
  .phone-screen{
    background:linear-gradient(180deg,#eaf3ff 0%,#f5f8fc 22%,#f3f6fb 100%);
    border-radius:36px; overflow:hidden; height:780px; position:relative;
    display:flex; flex-direction:column;
  }
  .statusbar{
    height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:14px; font-weight:600; color:#10131a; position:relative; z-index:5;
    background:transparent;
  }
  .statusbar .right{ display:flex; align-items:center; gap:6px; font-size:13px; }
  .notch{
    position:absolute; top:11px; left:50%; transform:translateX(-50%);
    width:128px; height:30px; background:#0b0d10; border-radius:18px; z-index:6;
  }
  .scroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; position:relative; }
  .scroll::-webkit-scrollbar{ width:0; }
  .pad{ padding:6px 14px 26px; }
  .phone-label{ text-align:center; margin-top:14px; font-size:12.5px; color:#7a818c; font-weight:600; }

  /* ===== 通用卡片 ===== */
  .card{ background:var(--bg-card); border-radius:15px; box-shadow:var(--shadow); padding:14px; margin:11px 0; border:1px solid #eef1f6; }
  .card-t{ display:flex; align-items:center; gap:7px; font-size:14.5px; font-weight:700; color:#1c1c1e; }
  .card-t .ic{ font-size:15px; }
  .muted{ color:var(--sub); }
  .tag{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:#eef2f8; color:#65707d; font-weight:600; }
  .tag.blue{ background:#e6f1ff; color:#0a6fe0; }
  .tag.amber{ background:#fdf3df; color:#9a7212; }
  .tag.gray{ background:#eef0f3; color:#8a909a; }
  .tag.green{ background:#e4f7ec; color:#1f9d55; }
  .pill{ display:inline-block; font-size:12px; padding:5px 11px; border-radius:999px; background:#fff; border:1px solid #dfe5ee; color:#4b525c; margin:3px 5px 3px 0; }
  .divider{ height:1px; background:var(--line); margin:11px 0; }

  /* PK 页头 */
  .pkhead{ background:linear-gradient(135deg,#1f6fff,#5b54e6); border-radius:16px; padding:13px 14px; color:#fff; box-shadow:0 8px 22px rgba(46,76,160,.28); }
  .pkhead .ttl{ font-size:12px; opacity:.9; }
  .pk-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .pk-car{ flex:1; background:rgba(255,255,255,.14); border-radius:12px; padding:9px 8px; text-align:center; }
  .pk-car .carshape{ height:34px; border-radius:8px; margin:0 auto 6px; width:74%;
    background:linear-gradient(180deg,#ffffff,#dfe7f4); position:relative; }
  .pk-car .carshape::after{ content:""; position:absolute; left:14%; right:14%; bottom:5px; height:11px; border-radius:6px 6px 3px 3px; background:rgba(40,60,110,.18); }
  .pk-car.zk .carshape{ background:linear-gradient(180deg,#ffffff,#d8eedf); }
  .pk-car .nm{ font-size:12.5px; font-weight:700; }
  .pk-car .pr{ font-size:10.5px; opacity:.85; margin-top:1px; }
  .vs{ font-size:13px; font-weight:800; opacity:.95; }

  /* query 胶囊 */
  .query{ margin:11px 0 4px; display:flex; gap:8px; align-items:flex-start; }
  .query .av{ flex:0 0 26px; width:26px; height:26px; border-radius:50%; background:#0a84ff; color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .query .bubble{ background:#0a84ff; color:#fff; border-radius:14px 14px 14px 4px; padding:9px 12px; font-size:13.5px; line-height:1.45; box-shadow:0 4px 12px rgba(10,132,255,.22); }

  /* 折叠占位条 */
  .fold-strip{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px dashed #d4dbe6; border-radius:12px; padding:11px 13px; margin:10px 0; color:#8a909a; font-size:12.5px; }
  .fold-strip .chev{ color:#b9c0cb; font-size:13px; }

  /* 关注点列表（左页/我的关注点） */
  .focus-q{ display:flex; gap:9px; align-items:flex-start; padding:9px 2px; border-bottom:1px solid #f0f3f8; }
  .focus-q:last-child{ border-bottom:0; }
  .focus-q .qx{ flex:0 0 20px; width:20px; height:20px; border-radius:6px; background:#eaf2ff; color:#0a6fe0; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .focus-q .qt{ font-size:13.5px; color:#2a2f37; }
  .focus-q.aside .qt{ color:#9aa0a8; }

  /* 候选车分类（左页） */
  .cand-group{ margin-top:9px; }
  .cand-label{ font-size:11.5px; color:#8a909a; font-weight:600; margin:8px 0 5px; }
  .cand{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:11px; border:1px solid #e8ecf2; margin-bottom:6px; background:#fff; }
  .cand.hi{ border-color:var(--hi-line); background:var(--hi); }
  .cand.muted-c{ opacity:.95; }
  .cand.gray-c{ filter:grayscale(.7); opacity:.55; }
  .cand .dot{ width:9px; height:9px; border-radius:50%; background:#c7ccd4; flex:0 0 9px; }
  .cand.hi .dot{ background:var(--green); }
  .cand .cnm{ font-size:13px; font-weight:600; color:#2a2f37; }
  .cand .cmeta{ font-size:11px; color:#8a909a; }
  .cand .ctag{ margin-left:auto; }

  /* CTA 按钮 */
  .cta{ display:block; width:100%; height:47px; line-height:47px; text-align:center; border:none; cursor:pointer;
    background:linear-gradient(180deg,#0a8bff,#0a78ed); color:#fff; font-size:15.5px; font-weight:700; border-radius:13px;
    box-shadow:0 8px 20px rgba(10,132,255,.32); margin-top:6px; letter-spacing:.3px; }
  .cta:active{ transform:translateY(1px); }
  .cta.lead{ background:linear-gradient(180deg,#16c172,#11a861); box-shadow:0 8px 20px rgba(22,193,114,.3); }
  .cta2{ display:block; width:100%; height:39px; line-height:39px; text-align:center; cursor:pointer;
    background:#eef3fb; color:#0a6fe0; font-size:13.5px; font-weight:600; border:1px solid #dde7f4; border-radius:11px; margin-top:8px; }

  /* ===== 报告页 ===== */
  .report-hero{ background:linear-gradient(150deg,#0a84ff 0%,#3a6cf0 55%,#6b5cf0 100%); color:#fff; border-radius:18px; padding:16px 15px; box-shadow:0 14px 30px rgba(40,76,180,.3); }
  .report-hero .htag{ font-size:11px; background:rgba(255,255,255,.2); padding:3px 9px; border-radius:999px; display:inline-block; }
  .report-hero h2{ font-size:18px; font-weight:800; margin:9px 0 3px; }
  .report-hero .phase{ font-size:12.5px; color:#e3ecff; }
  .report-hero .phase b{ color:#fff; }
  .report-hero .body{ font-size:13px; line-height:1.6; margin-top:10px; color:#f1f5ff; background:rgba(255,255,255,.12); border-radius:12px; padding:11px 12px; }

  .profile .pf-row{ padding:9px 0; border-bottom:1px solid #f0f3f8; }
  .profile .pf-row:last-child{ border-bottom:0; }
  .pf-k{ font-size:11.5px; color:#8a909a; font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:5px; }
  .pf-v{ font-size:13.5px; color:#2a2f37; line-height:1.55; }
  .pf-tags .pill{ background:#f3f7fd; }

  /* 证据台 */
  .ev-head{ position:sticky; top:0; z-index:8; background:linear-gradient(180deg,#f3f6fb 75%,rgba(243,246,251,0)); padding:8px 2px 7px; }
  .ev-head .eh-t{ font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:space-between; }
  .ev-head .eh-s{ font-size:11.5px; color:#8a909a; margin-top:2px; }
  .toggle-all{ font-size:12px; color:#0a6fe0; font-weight:600; cursor:pointer; }

  .ev{ background:#fff; border-radius:14px; border:1px solid #eaeef4; box-shadow:0 4px 14px rgba(18,38,63,.06); margin:10px 0; overflow:hidden; }
  .ev-q{ display:flex; align-items:flex-start; gap:8px; padding:13px 13px; cursor:pointer; }
  .ev-q .qn{ flex:0 0 22px; width:22px; height:22px; border-radius:7px; background:#0a84ff; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .ev-q .qmain{ flex:1; }
  .ev-q .qtitle{ font-size:14px; font-weight:700; color:#1c1c1e; line-height:1.4; }
  .ev-q .qdim{ display:inline-block; margin-top:5px; }
  .ev-q .chev{ color:#b9c0cb; font-size:14px; margin-top:2px; transition:transform .2s; }
  .ev.open .ev-q .chev{ transform:rotate(180deg); }
  .ev-foldsum{ font-size:12.5px; color:#7a818c; padding:0 13px 12px 43px; line-height:1.5; margin-top:-4px; }
  .ev.open .ev-foldsum{ display:none; }
  .ev-body{ display:none; padding:0 13px 13px; }
  .ev.open .ev-body{ display:block; }

  .seg{ margin-top:11px; }
  .seg-l{ font-size:11.5px; font-weight:700; color:#0a6fe0; display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .seg-l .sq{ width:5px; height:13px; border-radius:3px; background:#0a84ff; display:inline-block; }
  .seg.warn .seg-l{ color:#c8800f; } .seg.warn .sq{ background:#e8a000; }
  .seg.impact .seg-l{ color:#1f9d55; } .seg.impact .sq{ background:#1f9d55; }
  .seg p{ font-size:13px; color:#39404a; line-height:1.6; }
  .ev-cite{ background:#f7f9fc; border-radius:10px; padding:9px 11px; margin-top:6px; }
  .ev-cite .ct-k{ font-size:11px; color:#9aa0a8; font-weight:600; margin-bottom:3px; }
  .ev-cite .ct-v{ font-size:12.5px; color:#39404a; line-height:1.55; }
  .ev-cite.owner .ct-k{ color:#b07d2a; }
  .revcond{ background:#fff7ea; border:1px solid #f3e1bd; border-radius:9px; padding:8px 10px; margin-top:7px; font-size:12.5px; color:#8a6a18; line-height:1.55; }
  .ev-link{ display:inline-flex; align-items:center; gap:5px; margin-top:11px; font-size:12.5px; color:#0a6fe0; font-weight:600; cursor:pointer; background:#eef5ff; padding:7px 11px; border-radius:9px; border:1px solid #d3e6ff; }

  /* 决策台 */
  .rec{ border:1px solid #eaeef4; border-radius:14px; overflow:hidden; margin:10px 0; background:#fff; box-shadow:0 4px 14px rgba(18,38,63,.06); }
  .rec.hi{ border-color:#bcdcff; box-shadow:0 6px 18px rgba(10,132,255,.12); }
  .rec-top{ display:flex; gap:11px; padding:13px; align-items:center; }
  .rec-img{ flex:0 0 78px; width:78px; height:54px; border-radius:10px; background:linear-gradient(180deg,#eef3fb,#dde7f5); position:relative; }
  .rec-img::after{ content:""; position:absolute; left:12%; right:12%; top:38%; bottom:14%; border-radius:9px 11px 7px 7px; background:linear-gradient(180deg,#ffffff,#cdd9ec); box-shadow:0 4px 8px rgba(40,60,110,.16); }
  .rec-img.zk::after{ background:linear-gradient(180deg,#ffffff,#cbe6d4); }
  .rec-meta{ flex:1; }
  .rec-nm{ font-size:13.5px; font-weight:700; color:#1c1c1e; line-height:1.35; }
  .rec-pr{ font-size:13px; color:#e8540e; font-weight:700; margin-top:2px; }
  .rec-role{ margin-top:5px; }
  .rec-body{ padding:0 13px 13px; }
  .rec-why{ font-size:12.5px; color:#39404a; line-height:1.6; }
  .rec-need{ font-size:12px; color:#8a6a18; background:#fff7ea; border:1px solid #f3e1bd; border-radius:9px; padding:7px 10px; margin-top:8px; line-height:1.5; }
  .rec-other-toggle{ text-align:center; font-size:12.5px; color:#0a6fe0; font-weight:600; cursor:pointer; padding:10px; background:#eef5ff; border-radius:11px; margin:8px 0; border:1px dashed #cfe2ff; }

  .fb .fb-opts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
  .fb-opt{ cursor:pointer; font-size:12.5px; padding:8px 13px; border-radius:999px; border:1px solid #dfe5ee; background:#fff; color:#4b525c; user-select:none; }
  .fb-opt.on{ background:#e6f1ff; border-color:#9fc4ff; color:#0a6fe0; font-weight:600; }

  .backbar{ position:sticky; bottom:0; background:linear-gradient(180deg,rgba(243,246,251,0),#f3f6fb 35%); padding:10px 0 4px; margin-top:6px; }
  .backbar .bb{ display:block; width:100%; height:44px; line-height:44px; text-align:center; cursor:pointer;
    background:#fff; border:1px solid #d6deea; border-radius:12px; color:#3a3f47; font-size:14px; font-weight:600; box-shadow:0 4px 12px rgba(18,38,63,.07); }

  .section-h{ font-size:13px; font-weight:800; color:#aeb6c2; letter-spacing:1px; margin:18px 4px 4px; text-transform:uppercase; }

  /* toast */
  .toast{ position:fixed; left:50%; bottom:42px; transform:translateX(-50%) translateY(20px); background:rgba(20,24,32,.92); color:#fff; padding:11px 20px; border-radius:12px; font-size:13.5px; opacity:0; transition:all .26s ease; z-index:200; pointer-events:none; box-shadow:0 10px 30px rgba(0,0,0,.3); max-width:80vw; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:880px){
    .phones{ gap:18px; } .link-arrow{ display:none; }
    .phone{ width:360px; }
  }
</style>
</head>
<body>
  <div class="demo-banner">
    内部演示：同一用户 / 同一 pair（特斯拉 Model Y vs 极氪001）/ 同一份报告的 <b>5 个状态快照</b> ·
    <b>S1 首轮 battle → S5 行动承接</b>，左页越聊越懂、右页越收敛、动作越接近查价试驾留资
  </div>

  <div class="switcher-wrap">
    <div class="switcher" id="switcher"></div>
  </div>

  <div class="canvas">
    <div class="stage-line" id="stageLine"></div>
    <div class="phones">
      <!-- 左：对比智能体页 -->
      <div>
        <div class="phone">
          <div class="phone-screen">
            <div class="notch"></div>
            <div class="statusbar">
              <span>9:41</span>
              <span class="right">●●●● &nbsp;<span style="font-size:11px">5G</span> &nbsp;🔋</span>
            </div>
            <div class="scroll" id="leftScroll"><div class="pad" id="leftPad"></div></div>
          </div>
        </div>
        <div class="phone-label">① 对比智能体页 · 我的对比记录</div>
      </div>

      <!-- 联动箭头 -->
      <div class="link-arrow">
        <svg viewBox="0 0 54 26"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa6b6"/></marker></defs>
          <path d="M2,13 L46,13" stroke="#9aa6b6" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-dasharray="4 3"/></svg>
        <div class="cap">左页对话 → 右页沉淀为报告</div>
      </div>

      <!-- 右：个性化选车报告页 -->
      <div>
        <div class="phone">
          <div class="phone-screen">
            <div class="notch"></div>
            <div class="statusbar">
              <span>9:41</span>
              <span class="right">●●●● &nbsp;<span style="font-size:11px">5G</span> &nbsp;🔋</span>
            </div>
            <div class="scroll" id="rightScroll"><div class="pad" id="rightPad"></div></div>
          </div>
        </div>
        <div class="phone-label">② 个性化选车报告页 · 状态台 / 证据台 / 决策台</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================================
   全部数据写死，按 stage 组织。来源：汽车之家车型库（客观参数）；车主口碑为 mock。
   ========================================================================= */
const STAGE_KEYS = ["S1","S2","S3","S4","S5"];
const STAGE_META = {
  S1:{ name:"首轮 battle", phase:"候选取舍阶段", query:"Model Y 和极氪001 怎么选？我预算 30 万左右，主要家用。" },
  S2:{ name:"偏好纠偏", phase:"偏好修正阶段", query:"我更在意家用舒适和后排空间，智驾不用太强。" },
  S3:{ name:"倾向形成", phase:"倾向形成阶段", query:"那是不是更适合选极氪？我主要担心续航和售后。" },
  S4:{ name:"版本确认", phase:"版本确认阶段", query:"如果选极氪，买哪个版本？预算最好别超过 30 万。" },
  S5:{ name:"行动承接", phase:"行动准备阶段", query:"我准备周末去试驾，帮我准备试驾重点，顺便看看本地落地价。" },
};

/* ---------------- 左页：我的对比记录 ---------------- */
const LEFT = {
  S1:{
    notice:"本报告基于你本轮发起的 Model Y、极氪001 对比对话整理，提炼出家用后排、续航补能、落地价等关注要点；你后续补充的偏好，将在累计 3–5 轮对话后的下一期报告中补充更新。",
    focus:["家里坐着舒不舒服？","续航和补能够不够用？","落地价会不会超预算？"],
    cand:{ lean:[], leanLabel:"继续考察（Model Y & 极氪001）",
           leanList:[{nm:"特斯拉 Model Y",meta:"长续航后驱版 · 28.85万",cls:"zk-no"},{nm:"极氪001",meta:"103度四驱 Ultra版 · 29.98万",cls:"zk-yes"}],
           leanTag:"继续考察", undecided:[], excluded:[] },
    cta:"查看我的完整选车报告", lead:false,

function renderSwitcher(){
  $("switcher").innerHTML = STAGE_KEYS.map(k=>{
    const m=STAGE_META[k];
    return `<div class="tab ${k===stage?'active':''}" data-k="${k}">
      <div class="t1">${k}</div><div class="t2">${esc(m.name)}</div></div>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setStage(t.dataset.k));
  const m=STAGE_META[stage];
  $("stageLine").innerHTML = `当前快照：<b style="color:#3a3f47">${stage} · ${esc(m.name)}</b> &nbsp;|&nbsp; 本轮用户说：「${esc(m.query)}」`;
}

window.toggleAll = () => {
  const evs=document.querySelectorAll("#rightPad .ev");
  const anyClosed=[...evs].some(e=>!e.classList.contains("open"));
  evs.forEach(e=> anyClosed ? e.classList.add("open") : e.classList.remove("open"));
};
window.toggleOther = el => {
  const w=$("otherWrap"); const show=w.style.display==="none";
  w.style.display= show?"block":"none";
  el.innerHTML = show ? "收起其他候选车 ▴" : `还有其他候选车？点击展开（${w.children.length}）▾`;
};
window.cta = msg => toast(msg);

function setStage(k){
  stage=k;
  renderSwitcher(); renderLeft(); renderRight();
  $("leftScroll").scrollTop=0; $("rightScroll").scrollTop=0;
}

/* 初始 */
renderSwitcher(); renderLeft(); renderRight();
</script>
