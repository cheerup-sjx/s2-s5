<style>

  // 参数表
  const rows=PTABLE.map(r=>`<tr><td>${esc(r.k)}</td>
    <td class="${r.w==='my'?'win':''}">${esc(r.my)}</td>
    <td class="${r.w==='zk'?'winzk':''}">${esc(r.zk)}</td>
    <td class="note">${esc(r.note)} ›</td></tr>`).join("");
  // 车主评价
  const aggHtml=REVIEW.agg.map(a=>`<span class="ratepill">${esc(a.k)} <b>${esc(a.v)}</b></span>`).join("");
  const revHtml=REVIEW.cards.map(r=>`<div class="rev"><div class="ravt">${esc(r.av)}</div>
    <div class="rmain"><div class="rname">${esc(r.name)} <span class="tag">${esc(r.tag)}</span></div>
    <div class="rtxt">${esc(r.txt)}</div></div></div>`).join("");
  // 我的关注点
  const focusHtml=L.focus.map((f,i)=>{const aside=f.startsWith("（");
    return `<div class="focus-q ${aside?'aside':''}"><span class="qx">${aside?'·':(i+1)}</span><span class="qt">${esc(f)}</span></div>`;}).join("");
  // 候选车
  let candHtml=`<div class="cand-label">${esc(L.cand.leanLabel)}</div>`+
    L.cand.leanList.map(c=>`<div class="cand hi"><span class="dot"></span><div><div class="cnm">${esc(c.nm)}</div><div class="cmeta">${esc(c.meta)}</div></div><span class="ctag tag green">目前倾向</span></div>`).join("");
  if(L.cand.undecided){ candHtml+=`<div class="cand-label">${esc(L.cand.undecidedLabel)}</div>`+
    L.cand.undecided.map(c=>`<div class="cand"><span class="dot"></span><div><div class="cnm">${esc(c.nm)}</div><div class="cmeta">${esc(c.meta)}</div></div><span class="ctag tag">还没确定</span></div>`).join(""); }
  candHtml+=`<div class="cand-label">暂时排除</div><div style="font-size:11.5px;color:#aab0ba;padding:4px 2px;">（暂无）你没有明确放弃任何一台，Model Y 仍保留为候选。</div>`;
  const nfHtml=L.notFound.map(n=>`<div class="nf-i">· ${esc(n)}</div>`).join("");
  const dimHtml=C.dims.map(d=>`<span class="dimtab ${d===C.active?'on':''}">${esc(d)}</span>`).join("");

  $("leftPad").innerHTML=`
    <div class="pkhead">
      <div class="pk-row">
        <div class="pk-car"><div class="carshape"></div><div class="nm">特斯拉 Model Y</div><div class="pr">26.35万起</div></div>
        <div class="vsbadge">PK</div>
        <div class="pk-car zk"><div class="carshape"></div><div class="nm">极氪7X</div><div class="pr">22.98万起</div></div>
      </div>
      <div class="query"><div class="av">我</div><div class="bubble">${esc(USER_Q[stage])}</div></div>
    </div>

    <div class="card"><div class="card-t"><span class="ic">📝</span>双车简介</div>
      <div style="margin-top:6px;">
        <div class="intro-row"><div class="intro-badge my">Model<br>Y</div><div class="intro-txt"><b>特斯拉 Model Y｜</b>${INTRO.my}</div></div>
        <div class="intro-row"><div class="intro-badge zk">极氪<br>7X</div><div class="intro-txt"><b>极氪7X｜</b>${INTRO.zk}</div></div>
      </div></div>

    <div class="card"><div class="card-t"><span class="ic">⚖️</span>核心功能对比</div>
      <div class="dimtabs">${dimHtml}</div>
      <div class="dim-concl"><div class="dc-h">✦ ${esc(C.active)}维度 · 高亮结论</div><p>${esc(C.concl)}</p></div>
    </div>

    <div class="card"><div class="card-t"><span class="ic">📊</span>车型对比结果<span class="more" onclick="cta('展开全部参数（演示）')">查看全部参数 ›</span></div>
      <table class="ptable" style="margin-top:8px;">
        <thead><tr><th>参数</th><th>Model Y</th><th>极氪7X</th><th>差异提示</th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div style="font-size:10.5px;color:#aab0ba;margin-top:7px;">参数来源：汽车之家车型库</div>
    </div>

    <div class="card"><div class="card-t"><span class="ic">💬</span>真实车主评价</div>
      <div class="ratebar" style="margin-top:9px;"><div class="big">${REVIEW.total}<small> 条</small></div>
        <div class="stat">${aggHtml}</div></div>
      <div class="divider"></div>${revHtml}
      <div class="table-more" onclick="cta('查看全部 ${REVIEW.total} 条评价（演示）')">查看全部评价 ›</div>
    </div>

    <div class="card"><div class="card-t"><span class="ic">⚠️</span>注意事项</div>
      <div style="margin-top:5px;">
        <div class="warn-row"><span class="wb my">Model Y</span><span class="wt">${esc(NOTICE.my)}</span></div>
        <div class="warn-row"><span class="wb zk">极氪7X</span><span class="wt">${esc(NOTICE.zk)}</span></div>
      </div></div>

    <div class="card"><div class="card-t"><span class="ic">🏆</span>更推荐买哪个版本</div>
      <div style="margin-top:8px;">${verHtml}</div></div>

    <div class="card"><div class="card-t"><span class="ic">🎚️</span>选择偏好，为你推荐更</div>
      <div class="pref-chips">${prefHtml}</div></div>

    <div class="card"><div class="card-t"><span class="ic">📋</span>我的对比记录 <span class="tag blue" style="margin-left:6px;">第 ${L.rounds} 轮 · 摘要模式</span></div>
      <div class="rec-meta-line" style="margin:7px 0 2px;">本记录基于你与 Model Y、极氪7X 的 ${L.rounds} 轮对比对话整理，关注点与候选随轮累积更新。</div>
      <div class="divider"></div>
      <div style="font-size:11.5px;color:#8a909a;font-weight:700;margin-bottom:3px;">我的关注点</div>${focusHtml}
      <div class="divider"></div>${candHtml}
      <div class="notfound"><div class="nf-h">未找到 / 你还没问的问题</div>${nfHtml}</div>
    </div>

    <button class="cta ${L.lead?'lead':''}" onclick="cta('${esc(L.cta)}')">${esc(L.cta)} ›</button>
  `;
}

/* ---- 右页：个性化选车报告页 ---- */
function renderRight(){
  const P=PROGRESS[stage], F=FOCUS[stage], m=STAGE_META[stage];
  // 进度报告 + 重点关注 + 行动建议
  const head=`
    <div class="report-hero">
      <span class="htag">✦ 当前选车进度报告</span>
      <h2>你的选车报告已生成</h2>
      <div class="phase">当前选车进度：<b>${esc(m.phase)}</b></div>
      <div class="body">${esc(P)}</div>
    </div>
    <div class="card"><div class="card-t"><span class="ic">📌</span>重点关注</div>
      <div style="margin-top:7px;">${F.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div></div>
    <div class="card"><div class="card-t"><span class="ic">🧭</span>行动建议</div>
      <div style="font-size:13px;color:#39404a;line-height:1.6;margin-top:6px;">${esc(F.advice)}</div></div>`;

  // 我的对比记录（论证手风琴）
  const evs=EVIDENCE[stage], openN=EV_OPEN[stage];
  const evHtml=evs.map((e,i)=>{const open=i<openN;
    return `<div class="ev ${open?'open':''}">
      <div class="ev-q" onclick="toggleEv(this)"><span class="qn">${i+1}</span>
        <div class="qmain"><div class="qtitle">${esc(e.q)}</div><span class="qdim tag">${esc(e.dim)}</span></div>
        <span class="chev">▾</span></div>
      <div class="ev-foldsum">${esc(e.concl)}</div>
      <div class="ev-body">
        <div class="seg"><div class="seg-l"><span class="sq"></span>先看结论</div><p>${esc(e.concl)}</p></div>
        <div class="seg"><div class="seg-l"><span class="sq"></span>判断依据</div>
          <div class="ev-cite"><div class="ct-k">车型库证据 · 汽车之家车型库</div><div class="ct-v">${esc(e.lib)}</div></div>
          <div class="ev-cite owner"><div class="ct-k">车主口碑（聚合 mock）</div><div class="ct-v">${esc(e.owner)}</div></div></div>
        <div class="seg warn"><div class="seg-l"><span class="sq"></span>注意事项</div><p>${esc(e.caution)}</p></div>
        <div class="seg impact"><div class="seg-l"><span class="sq"></span>怎么影响选车（含反转条件）</div><p>${esc(e.impact)}</p></div>
        <div class="ev-link" onclick="cta('正在前往「品库++对比页」：Model Y vs 极氪7X 历史对比')">去看历史对比 · Model Y vs 极氪7X ↗</div>
      </div></div>`;}).join("");

  // 车型推荐
  const R=RECS[stage];
  const recCard=r=>`
    <div class="rec ${ROLE_CLASS[r.role]==='blue'?'hi':''}">
      <div class="rec-top"><div class="rec-img ${r.zk?'zk':''}"></div>
        <div class="rec-meta"><div class="rec-brand">${esc(r.brand)}</div><div class="rec-nm">${esc(r.car)}</div>
          <div class="rec-lv">${esc(r.lv)}</div><div class="rec-pr">${esc(r.price)}</div>
          <div class="rec-role"><span class="tag ${ROLE_CLASS[r.role]}">${esc(r.role)}</span></div></div></div>
      <div class="rec-body"><div class="rec-why">${esc(r.why)}</div><div class="rec-need">${esc(r.need)}</div></div>
      <div class="rec-chips">
        ${["暂不考虑","先放一边","重点看这台"].map(c=>`<span class="rchip ${c===r.chip?'on':''}" onclick="pickChip(this)">${c}</span>`).join("")}
      </div></div>`;
  const leanHtml=R.lean.map(recCard).join("");
  const otherHtml=R.other.length?`
    <div class="rec-other-toggle" onclick="toggleOther(this)">还有其他候选车？点击展开（${R.other.length}）▾</div>
    <div id="otherWrap" style="display:none;">${R.other.map(recCard).join("")}</div>`:"";

  $("rightPad").innerHTML=`
    ${head}
    <div class="ev-head"><span class="eh-t">我的对比记录</span><span class="toggle-all" onclick="toggleAll()">展开 / 收起全部</span></div>
    <div style="font-size:11.5px;color:#8a909a;margin:-2px 4px 4px;">先不纠结全量参数，重点看这几件会影响你选择的事</div>
    ${evHtml}

    <div class="card"><div class="card-t"><span class="ic">⭐</span>个性化车型推荐</div>
      <div style="margin-top:8px;">${leanHtml}</div>${otherHtml}
      <div class="table-more" onclick="cta('查看更多车型推荐（演示）')">查看更多 ›</div></div>

    <div class="card"><div class="card-t"><span class="ic">🛠️</span>这份报告哪里需要调整？可多选。</div>
      <div class="fb-opts">${FEEDBACK_OPTS.map((o,i)=>`<div class="fb-opt ${i===0&&stage!=='S1'?'on':''}" onclick="this.classList.toggle('on')"><span class="ck">✓</span>${esc(o)}</div>`).join("")}</div>
      <div class="fb-submit" onclick="cta('反馈已记录，将在下一期报告中体现（演示）')">提交反馈</div></div>

    <div class="backbar"><div class="bb" onclick="cta('${stage==='S5'?'试驾后回来更新报告':'回到车系对比 · Model Y vs 极氪7X'}')">${stage==='S5'?'试驾后回来更新报告':'回到车系对比'} ›</div></div>
  `;
}

/* ---- 交互 ---- */
window.toggleEv=el=>el.closest(".ev").classList.toggle("open");
window.toggleAll=()=>{const evs=document.querySelectorAll("#rightPad .ev");
  const anyClosed=[...evs].some(e=>!e.classList.contains("open"));
  evs.forEach(e=>anyClosed?e.classList.add("open"):e.classList.remove("open"));};
window.toggleOther=el=>{const w=$("otherWrap");const show=w.style.display==="none";
  w.style.display=show?"block":"none";
  el.innerHTML=show?"收起其他候选车 ▴":`还有其他候选车？点击展开（${w.children.length}）▾`;};
window.pickChip=el=>{const row=el.parentElement;row.querySelectorAll(".rchip").forEach(c=>c.classList.remove("on"));el.classList.add("on");};

function setStage(k){ stage=k; renderSwitcher(); renderLeft(); renderRight(); $("leftScroll").scrollTop=0; $("rightScroll").scrollTop=0; }
renderSwitcher(); renderLeft(); renderRight();

;(function(){
  try {
    document.querySelectorAll('.ev').forEach(function(e){ e.classList.add('open'); });
    var w = document.getElementById('otherWrap'); if (w) { w.style.display = 'block'; }
  } catch(e) {}
})();

</script>
</body>
</html>
